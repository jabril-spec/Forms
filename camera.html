<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Escáner DNI</title>
<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#000;height:100%;font-family:'Segoe UI',Roboto,Arial,sans-serif;}
  #video{width:100%;height:100vh;object-fit:cover;display:block;}
  .guia{position:fixed;left:8%;right:8%;top:35%;bottom:35%;
    border:3px solid #FF7A00;border-radius:10px;pointer-events:none;
    box-shadow:0 0 0 2000px rgba(0,0,0,.45);}
  #estado{position:fixed;bottom:24px;left:0;right:0;text-align:center;
    font-size:14px;color:#fff;padding:0 24px;text-shadow:0 1px 3px rgba(0,0,0,.6);}
  #cerrar{position:fixed;top:14px;right:14px;background:#fff;color:#12213A;
    border:none;border-radius:8px;padding:8px 16px;font-weight:700;font-size:13px;}
</style>
</head>
<body>
  <video id="video" muted playsinline autoplay></video>
  <div class="guia"></div>
  <div id="estado">Iniciando cámara…</div>
  <button id="cerrar" onclick="window.close()">Cerrar</button>

  <script>
    // ⚠️ IMPORTANTE — reemplaza este valor por el ORIGEN real de tu web app.
    // Ábrela en el navegador y copia lo que aparece en la barra de direcciones
    // SOLO hasta el dominio, por ejemplo:
    //   https://n-XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX.script.googleusercontent.com
    // Mientras pruebas puedes dejarlo en '*', pero para producción restringe el origen.
    const ORIGEN_APP = '*';

    const lector = new ZXing.BrowserMultiFormatReader();
    let bloqueadoHasta = 0;

    function extraerDni(texto) {
      const m = String(texto).match(/\d{8}/);
      return m ? m[0] : String(texto).replace(/\D/g, '').slice(0, 8);
    }

    lector.listVideoInputDevices().then(function (dispositivos) {
      if (!dispositivos.length) {
        document.getElementById('estado').textContent = 'No se detectó ninguna cámara en este dispositivo.';
        return;
      }
      let deviceId = dispositivos[0].deviceId;
      const trasera = dispositivos.find(d => /back|trasera|rear|environment/i.test(d.label));
      if (trasera) deviceId = trasera.deviceId;

      lector.decodeFromVideoDevice(deviceId, 'video', function (resultado) {
        if (!resultado) return;
        const ahora = Date.now();
        if (ahora < bloqueadoHasta) return;
        const dni = extraerDni(resultado.getText());
        if (dni.length !== 8) return;

        bloqueadoHasta = ahora + 2500;
        if (navigator.vibrate) navigator.vibrate(120);
        document.getElementById('estado').textContent = 'DNI detectado: ' + dni;

        if (window.opener) {
          window.opener.postMessage({ tipo: 'dni-detectado', dni: dni }, ORIGEN_APP);
        }
        setTimeout(function () { window.close(); }, 600);
      });

      document.getElementById('estado').textContent = 'Apunta al código de barras del DNI.';
    }).catch(function () {
      document.getElementById('estado').textContent =
        'No se pudo acceder a la cámara (revisa los permisos del navegador).';
    });
  </script>
</body>
</html>
