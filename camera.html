<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Escáner DNI</title>
<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#000;height:100%;font-family:'Segoe UI',Roboto,Arial,sans-serif;}
  #video{width:100%;height:100vh;object-fit:cover;display:block;}
  .guia{position:fixed;left:8%;right:8%;top:35%;bottom:35%;
    border:3px solid #FF7A00;border-radius:10px;pointer-events:none;
    box-shadow:0 0 0 2000px rgba(0,0,0,.45);}
  .guia .etiqueta{position:absolute;top:-26px;left:0;right:0;text-align:center;
    color:#FFB35C;font-size:12px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.7);}

  #estado{position:fixed;bottom:100px;left:0;right:0;text-align:center;
    font-size:14px;color:#fff;padding:0 24px;text-shadow:0 1px 3px rgba(0,0,0,.6);
    min-height:20px;}
  #estado.procesando{color:#FFB35C;font-weight:700;}

  #cerrar{position:fixed;top:14px;right:14px;background:#fff;color:#12213A;
    border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;z-index:5;}

  .barra-inferior{position:fixed;bottom:20px;left:0;right:0;display:flex;
    flex-direction:column;align-items:center;gap:10px;padding:0 20px;z-index:5;}
  .fila-botones{display:flex;gap:10px;width:100%;max-width:380px;}
  .fila-botones button{flex:1;border:none;border-radius:10px;padding:13px 10px;
    font-weight:700;font-size:13.5px;background:#fff;color:#12213A;}
  #btnBarras.activo{background:#FF7A00;color:#fff;}
  #btnOcr.activo{background:#1B9C63;color:#fff;}
  .fila-botones button:disabled{opacity:.6;}
  #btnTorch{background:rgba(255,255,255,.85);}
  #btnTorch.torch-on{background:#FF7A00;color:#fff;}
  #btnTorch.oculto{display:none;}

  #capturaPreview{position:fixed;bottom:190px;left:50%;transform:translateX(-50%);
    max-width:70%;border:2px solid #1B9C63;border-radius:8px;display:none;}

  #avisoOrigen{position:fixed;top:0;left:0;right:0;background:#D64545;color:#fff;
    font-size:11.5px;text-align:center;padding:5px 10px;z-index:10;display:none;}
</style>
</head>
<body>
  <div id="avisoOrigen">No se recibió el origen de la app. Ábrelo desde la aplicación web, no directamente.</div>
  <video id="video" muted playsinline autoplay></video>
  <div class="guia"><span class="etiqueta" id="etiquetaGuia">Código de barras</span></div>
  <canvas id="capturaPreview"></canvas>
  <div id="estado">Iniciando cámara…</div>

  <button id="cerrar" onclick="window.close()">Cerrar</button>

  <div class="barra-inferior">
    <button id="btnTorch" class="oculto" onclick="alternarLinterna()">💡 Linterna</button>
    <div class="fila-botones">
      <button id="btnBarras" class="activo" onclick="activarModoBarras()">📷 Leer código de barras</button>
      <button id="btnOcr" onclick="capturarYLeerOcr()">🔢 Leer números</button>
    </div>
  </div>

  <script>
    // El origen real de tu app llega por la URL (Index.html lo agrega automáticamente
    // como ?origen=...). Este origen CAMBIA cada vez que publicas una nueva versión
    // del deployment de Apps Script (es un dominio *.googleusercontent.com generado
    // por Google para el sandbox del iframe), así que NUNCA debe hardcodearse:
    // si se hardcodea, postMessage() falla en silencio en cuanto se hace un
    // nuevo deployment, porque el "origen real" ya no coincide con el hardcodeado.
    const params = new URLSearchParams(window.location.search);
    const ORIGEN_APP = params.get('origen') || '*';

    if (!params.get('origen')) {
      document.getElementById('avisoOrigen').style.display = 'block';
    }

    let modo = 'barras';
    let lector = null;
    let bloqueadoHasta = 0;
    let trackActual = null;
    let torchEncendida = false;
    let ocrEnProceso = false;
    let intervaloEscaneo = null;

    function extraerDni(texto) {
      const m = String(texto).match(/\d{8}/);
      return m ? m[0] : String(texto).replace(/\D/g, '').slice(0, 8);
    }

    function ponerEstado(texto, procesando) {
      const el = document.getElementById('estado');
      el.textContent = texto;
      el.classList.toggle('procesando', !!procesando);
    }

    // Indicador de "vivo" para el escaneo de código de barras: como es una
    // lectura continua (no hay un % real como en el OCR), mostramos puntos
    // animados para que se note que la cámara sigue buscando activamente.
    function iniciarIndicadorEscaneo() {
      detenerIndicadorEscaneo();
      let puntos = 0;
      intervaloEscaneo = setInterval(function () {
        puntos = (puntos + 1) % 4;
        ponerEstado('Escaneando código de barras' + '.'.repeat(puntos), true);
      }, 450);
    }

    function detenerIndicadorEscaneo() {
      if (intervaloEscaneo) {
        clearInterval(intervaloEscaneo);
        intervaloEscaneo = null;
      }
    }

    function enviarDni(dni) {
      detenerIndicadorEscaneo();
      ponerEstado('DNI detectado: ' + dni, false);
      if (navigator.vibrate) navigator.vibrate(120);
      if (window.opener) {
        window.opener.postMessage({ tipo: 'dni-detectado', dni: dni }, ORIGEN_APP);
      }
      setTimeout(function () { window.close(); }, 700);
    }

    function activarModoBarras() {
      modo = 'barras';
      document.getElementById('btnBarras').classList.add('activo');
      document.getElementById('btnOcr').classList.remove('activo');
      document.getElementById('etiquetaGuia').textContent = 'Código de barras';
      iniciarIndicadorEscaneo();
    }

    // ---------- Cámara + escaneo continuo de código de barras ----------
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    lector = new ZXing.BrowserMultiFormatReader(hints);

    const constraints = {
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    };

    lector.decodeFromConstraints(constraints, 'video', function (resultado) {
      if (!resultado || modo !== 'barras') return;
      const ahora = Date.now();
      if (ahora < bloqueadoHasta) return;
      const dni = extraerDni(resultado.getText());
      if (dni.length !== 8) return;
      bloqueadoHasta = ahora + 2500;
      enviarDni(dni);
    }).catch(function () {
      detenerIndicadorEscaneo();
      ponerEstado('No se pudo acceder a la cámara (revisa los permisos del navegador).', false);
    });

    document.getElementById('video').addEventListener('loadedmetadata', function () {
      const video = document.getElementById('video');
      if (!video.srcObject) return;
      trackActual = video.srcObject.getVideoTracks()[0];
      const capacidades = trackActual.getCapabilities ? trackActual.getCapabilities() : {};
      if (capacidades.torch) {
        document.getElementById('btnTorch').classList.remove('oculto');
      }
      if (modo === 'barras') iniciarIndicadorEscaneo();
    });

    function alternarLinterna() {
      if (!trackActual) return;
      torchEncendida = !torchEncendida;
      trackActual.applyConstraints({ advanced: [{ torch: torchEncendida }] }).catch(function () {});
      document.getElementById('btnTorch').classList.toggle('torch-on', torchEncendida);
    }

    // ---------- OCR de respaldo (lee los números impresos del DNI) ----------
    function capturarYLeerOcr() {
      if (ocrEnProceso) return;
      const video = document.getElementById('video');
      if (!video.videoWidth) return;

      modo = 'ocr';
      detenerIndicadorEscaneo();
      document.getElementById('btnOcr').classList.add('activo');
      document.getElementById('btnBarras').classList.remove('activo');
      document.getElementById('etiquetaGuia').textContent = 'Número de DNI';

      ocrEnProceso = true;
      document.getElementById('btnOcr').disabled = true;
      document.getElementById('btnBarras').disabled = true;
      ponerEstado('Procesando… 0%', true);

      const w = video.videoWidth, h = video.videoHeight;
      const cropX = w * 0.08, cropY = h * 0.35, cropW = w * 0.84, cropH = h * 0.30;

      const canvas = document.getElementById('capturaPreview');
      canvas.width = cropW;
      canvas.height = cropH;
      canvas.style.display = 'block';
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

      Tesseract.recognize(canvas, 'eng', {
        tessedit_char_whitelist: '0123456789',
        logger: function (m) {
          if (m.status === 'recognizing text') {
            ponerEstado('Procesando… ' + Math.round(m.progress * 100) + '%', true);
          } else if (m.status) {
            ponerEstado('Procesando (' + m.status + ')…', true);
          }
        }
      }).then(function (resultado) {
        canvas.style.display = 'none';
        ocrEnProceso = false;
        document.getElementById('btnOcr').disabled = false;
        document.getElementById('btnBarras').disabled = false;

        const texto = resultado.data.text || '';
        const dni = extraerDni(texto);
        if (dni.length === 8) {
          enviarDni(dni);
        } else {
          ponerEstado('No se pudo leer un DNI válido. Intenta con más luz o mejor encuadre.', false);
        }
      }).catch(function () {
        canvas.style.display = 'none';
        ocrEnProceso = false;
        document.getElementById('btnOcr').disabled = false;
        document.getElementById('btnBarras').disabled = false;
        ponerEstado('Error al leer los números, intenta de nuevo.', false);
      });
    }
  </script>
</body>
</html>
